<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News // Terminal</title>
    <style>
        :root {
            --bg: #0D1117;
            --surface: #161B22;
            --border: #30363D;
            --text: #C9D1D9;
            --text-dim: #8B949E;
            --accent: #58A6FF;
            --green: #3FB950;
            --purple: #A371F7;
            --font-mono: 'SF Mono', 'Fira Code', 'Menlo', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        
        header {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        
        .logo {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo::before {
            content: ">";
            color: var(--green);
        }
        
        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        
        .meta {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            gap: 16px;
        }
        
        .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .meta .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .issue-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .issue-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .issue-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        
        .issue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .issue-num {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
        }
        
        .issue-date {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-dim);
        }
        
        .issue-summary {
            color: var(--text);
            font-size: 15px;
            line-height: 1.5;
        }
        
        .issue-tags {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .tag {
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            background: var(--bg);
            color: var(--text-dim);
        }
        
        .tag.model { color: var(--purple); }
        .tag.product { color: var(--accent); }
        .tag.tutorial { color: var(--green); }
        .tag.hardware { color: #F78166; }
        .tag.news { color: #F0883E; }
        
        footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-dim);
        }
        
        footer a {
            color: var(--accent);
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
        
        /* Detail view */
        .detail-view {
            display: none;
        }
        
        .detail-view.active {
            display: block;
        }
        
        .list-view.hidden {
            display: none;
        }
        
        .back-btn {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--accent);
            background: none;
            border: none;
            cursor: pointer;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn:hover {
            text-decoration: underline;
        }
        
        .detail-header {
            margin-bottom: 24px;
        }
        
        .detail-header h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }
        
        .article-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .article-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
        }
        
        .article-category {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent);
            margin-bottom: 8px;
        }
        
        .article-title {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .article-body {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.6;
        }
        
        .article-body a {
            color: var(--accent);
        }
        
        .article-source {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- List View -->
        <div class="list-view" id="listView">
            <header>
                <div class="logo">~/ai-news</div>
                <h1>AI News</h1>
                <div class="meta">
                    <span><span class="dot"></span> LIVE</span>
                    <span id="lastUpdate">--</span>
                    <span id="issueCount">-- issues</span>
                </div>
            </header>
            <div class="issue-list" id="issueList"></div>
            <footer>
                <p>Data from <a href="https://news.daheiai.com" target="_blank">daheiai.com</a></p>
                <p>Built with terminal aesthetics</p>
            </footer>
        </div>
        
        <!-- Detail View -->
        <div class="detail-view" id="detailView">
            <button class="back-btn" onclick="showList()">← Back</button>
            <div class="detail-header">
                <h2 id="detailTitle"></h2>
                <div class="meta" id="detailMeta"></div>
            </div>
            <div class="article-list" id="articleList"></div>
        </div>
    </div>
    
    <script>
        let issues = [];
        
        // 从RSS获取数据
        async function fetchNews() {
            try {
                const response = await fetch('https://news.daheiai.com/rss.php');
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                const items = xml.querySelectorAll('item');
                
                issues = [];
                items.forEach((item, index) => {
                    const title = item.querySelector('title').textContent;
                    const link = item.querySelector('link').textContent;
                    const description = item.querySelector('description').textContent;
                    const content = item.querySelector('content\\:encoded').textContent;
                    const pubDate = item.querySelector('pubDate').textContent;
                    
                    // 解析期号
                    const issueMatch = title.match(/第(\d+)期/);
                    const issueNum = issueMatch ? issueMatch[1] : (items.length - index);
                    
                    // 解析日期
                    const date = new Date(pubDate);
                    const dateStr = date.toLocaleDateString('zh-CN', { 
                        month: 'numeric', 
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    
                    // 提取文章
                    const articles = [];
                    const articleMatches = content.matchAll(/<li><strong>\[([^\]]+)\] ([^<]+)<\/strong><br\/>([^<]+)/g);
                    for (const match of articleMatches) {
                        articles.push({
                            category: match[1],
                            title: match[2],
                            body: match[3].replace(/<[^>]+>/g, '').trim()
                        });
                    }
                    
                    issues.push({
                        num: issueNum,
                        date: dateStr,
                        summary: description.replace(/<[^>]+>/g, '').trim(),
                        link: link,
                        articles: articles
                    });
                });
                
                renderList();
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
                document.getElementById('issueCount').textContent = issues.length + ' issues';
                
            } catch (e) {
                console.error('Fetch error:', e);
                document.getElementById('issueList').innerHTML = '<p style="color:var(--text-dim)">Failed to load data</p>';
            }
        }
        
        function renderList() {
            const list = document.getElementById('issueList');
            list.innerHTML = issues.map((issue, i) => `
                <div class="issue-card" onclick="showDetail(${i})">
                    <div class="issue-header">
                        <span class="issue-num">#${issue.num}</span>
                        <span class="issue-date">${issue.date}</span>
                    </div>
                    <p class="issue-summary">${issue.summary}</p>
                    <div class="issue-tags">
                        ${issue.articles.map(a => `<span class="tag ${getCategoryClass(a.category)}">${a.category}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }
        
        function getCategoryClass(cat) {
            if (cat.includes('模型')) return 'model';
            if (cat.includes('产品') || cat.includes('工具')) return 'product';
            if (cat.includes('教程') || cat.includes('技巧')) return 'tutorial';
            if (cat.includes('硬件')) return 'hardware';
            return 'news';
        }
        
        function showDetail(index) {
            const issue = issues[index];
            document.getElementById('listView').classList.add('hidden');
            document.getElementById('detailView').classList.add('active');
            document.getElementById('detailTitle').textContent = 'Issue #' + issue.num;
            document.getElementById('detailMeta').innerHTML = `<span>${issue.date}</span>`;
            document.getElementById('articleList').innerHTML = issue.articles.map(a => `
                <div class="article-item">
                    <div class="article-category">${a.category}</div>
                    <div class="article-title">${a.title}</div>
                    <div class="article-body">${a.body}</div>
                </div>
            `).join('');
            window.scrollTo(0, 0);
        }
        
        function showList() {
            document.getElementById('listView').classList.remove('hidden');
            document.getElementById('detailView').classList.remove('active');
        }
        
        // 初始化
        fetchNews();
        
        // 每5分钟刷新
        setInterval(fetchNews, 5 * 60 * 1000);
    </script>
</body>
</html>
