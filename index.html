<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI速报</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0A0A0A; color: #fff; padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { color: #C9A227; font-family: Georgia, serif; margin-bottom: 20px; font-size: 28px; }
        .issue { background: #1a1a1a; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .issue-header { display: flex; justify-content: space-between; align-items: center; }
        .issue h2 { color: #C9A227; font-size: 16px; }
        .date { color: #888; font-size: 13px; }
        .summary { background: #1a1a1a; border-radius: 12px; padding: 16px; margin-bottom: 16px; border-left: 3px solid #C9A227; }
        .summary-label { color: #C9A227; font-size: 12px; margin-bottom: 8px; }
        .summary p { color: #ccc; line-height: 1.6; font-size: 14px; }
        .articles { list-style: none; }
        .articles li { background: #1a1a1a; padding: 14px; margin-bottom: 10px; border-radius: 8px; }
        .articles strong { color: #fff; font-size: 14px; display: block; }
        .footer { text-align: center; color: #444; margin-top: 24px; font-size: 12px; }
        .footer a { color: #C9A227; text-decoration: none; }
    </style>
</head>
<body>
    <h1>🤖 AI速报</h1>
    <div class="issue">
        <div class="issue-header">
            <h2></h2>
            <span class="date">2026-03-25 04:02</span>
        </div>
    </div>
    <div class="summary">
        <div class="summary-label">◆ AI总结</div>
        <p></p>
    </div>
    <ul class="articles">
        
    </ul>
    <p class="footer"><a href="https://news.daheiai.com">查看原站</a></p>
</body>
</html>
